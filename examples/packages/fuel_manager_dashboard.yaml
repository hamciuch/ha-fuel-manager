# =============================================================================
#  Fuel Manager – pakiet pomocników i skryptów do formularza tankowania
#  Wersja WIELOAUTOWA. Umieść w: /config/packages/fuel_manager_dashboard.yaml
#  Wymaga w configuration.yaml:
#     homeassistant:
#       packages: !include_dir_named packages
#
#  Jedno auto? Zostaw jedną opcję w input_select.fuel_vehicle.
#  Dwa+ auta? Wpisz ich nazwy DOKŁADNIE tak, jak w integracji
#  (Ustawienia -> Urządzenia i usługi -> Fuel Manager -> tytuł wpisu).
#  Sensor najbliższej stacji jest dobierany automatycznie po nazwie auta
#  (slug), np. "MG HS" -> sensor.mg_hs_najblizsza_stacja.
# =============================================================================

input_select:
  fuel_vehicle:
    name: Auto
    icon: mdi:car
    options:
      - "MG EHS"
      # - "Skoda Octavia"   # <- dodaj kolejne auta tutaj (dokładnie jak nazwa w integracji)
  fuel_type:
    name: Rodzaj paliwa
    icon: mdi:gas-station
    options:
      - "Benzyna 95 (Pb95)"
      - "Benzyna 98 (Pb98)"
      - "Benzyna 100 (Pb100/Verva/V-Power)"
      - "Diesel (ON)"
      - "Diesel Premium"
      - "LPG"
      - "CNG"
      - "Prąd (EV)"
      - "Inny"
    initial: "Benzyna 95 (Pb95)"
  fuel_station:
    name: Stacja
    icon: mdi:map-marker
    options:
      - "— najpierw wyszukaj stacje —"

  fuel_edit_target:
    name: Tankowanie do edycji
    icon: mdi:pencil
    options:
      - "— odśwież listę —"
  fuel_edit_type:
    name: Edycja – rodzaj paliwa
    icon: mdi:gas-station
    options:
      - "Benzyna 95 (Pb95)"
      - "Benzyna 98 (Pb98)"
      - "Benzyna 100 (Pb100/Verva/V-Power)"
      - "Diesel (ON)"
      - "Diesel Premium"
      - "LPG"
      - "CNG"
      - "Prąd (EV)"
      - "Inny"
    initial: "Benzyna 95 (Pb95)"

  expense_category:
    name: Kategoria kosztu
    icon: mdi:shape
    options:
      - "Przegląd"
      - "Ubezpieczenie"
      - "Serwis"
      - "Naprawa"
      - "Opony"
      - "Myjnia"
      - "Autostrada/Parking"
      - "Akcesoria"
      - "Inne"
    initial: "Serwis"
  expense_edit_target:
    name: Koszt do edycji
    icon: mdi:pencil
    options:
      - "— odśwież listę —"

input_number:
  fuel_odometer:
    name: Przebieg
    min: 0
    max: 2000000
    step: 1
    unit_of_measurement: km
    icon: mdi:counter
    mode: box
  fuel_liters:
    name: Ilość paliwa
    min: 0
    max: 200
    step: 0.01
    unit_of_measurement: L
    icon: mdi:fuel
    mode: box
  fuel_price_per_liter:
    name: Cena za litr
    min: 0
    max: 50
    step: 0.001
    unit_of_measurement: zł/L
    icon: mdi:cash
    mode: box
  fuel_total_cost:
    name: Kwota całkowita
    min: 0
    max: 5000
    step: 0.01
    unit_of_measurement: zł
    icon: mdi:cash-multiple
    mode: box

  fuel_edit_odometer:
    name: Edycja – przebieg
    min: 0
    max: 2000000
    step: 1
    unit_of_measurement: km
    mode: box
  fuel_edit_fuel:
    name: Edycja – litry
    min: 0
    max: 200
    step: 0.01
    unit_of_measurement: L
    mode: box
  fuel_edit_price:
    name: Edycja – cena/litr
    min: 0
    max: 50
    step: 0.001
    unit_of_measurement: zł/L
    mode: box
  fuel_edit_total:
    name: Edycja – kwota
    min: 0
    max: 5000
    step: 0.01
    unit_of_measurement: zł
    mode: box

  expense_amount:
    name: Koszt – kwota
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: zł
    mode: box
  expense_odometer:
    name: Koszt – przebieg (opcjonalnie)
    min: 0
    max: 2000000
    step: 1
    unit_of_measurement: km
    mode: box

input_boolean:
  fuel_full_tank:
    name: Pełny bak
    icon: mdi:fuel
  fuel_use_car_fallback:
    name: Zapasowo lokalizacja auta
    icon: mdi:car-connected

  fuel_edit_full:
    name: Edycja – pełny bak
    icon: mdi:fuel
  fuel_edit_lock:
    name: Edycja – blokada przeliczania (wewn.)
    icon: mdi:lock

input_datetime:
  fuel_datetime:
    name: Data i czas tankowania
    has_date: true
    has_time: true
    icon: mdi:calendar-clock
  expense_date:
    name: Data kosztu
    has_date: true
    has_time: false
    icon: mdi:calendar

input_text:
  fuel_notes:
    name: Notatki
    max: 255
    icon: mdi:note-text
  fuel_manual_station:
    name: Stacja (ręcznie)
    max: 120
    icon: mdi:gas-station

  fuel_edit_id:
    name: Edycja – ID (ukryte)
    max: 80
    initial: ""
  fuel_edit_station:
    name: Edycja – stacja
    max: 120

  expense_description:
    name: Koszt – opis
    max: 250
  expense_edit_id:
    name: Koszt – ID (ukryte)
    max: 80
    initial: ""

script:
  # --- 1) Wyszukaj pobliskie stacje dla wybranego auta ----------------------
  fuel_find_stations:
    alias: "Tankowanie: znajdź stacje"
    icon: mdi:map-search
    sequence:
      # (OPCJONALNIE) świeży GPS z telefonu – ODKOMENTUJ i podmień na swój notify.mobile_app_*:
      # - service: notify.mobile_app_TWOJ_TELEFON
      #   data:
      #     message: "request_location_update"
      # - delay: "00:00:03"
      - service: fuel_manager.find_nearby_stations
        data:
          vehicle: "{{ states('input_select.fuel_vehicle') }}"
          radius: 1500
          use_phone_location: true
          use_car_location: "{{ is_state('input_boolean.fuel_use_car_fallback','on') }}"
          target_input_select: input_select.fuel_station
        response_variable: result
      - if: "{{ result.stations | count > 0 }}"
        then:
          - service: input_select.select_option
            target:
              entity_id: input_select.fuel_station
            data:
              option: "{{ result.stations[0].name }} ({{ result.stations[0].distance_m }} m)"

  # --- 2) Ustaw datę/czas na teraz ------------------------------------------
  fuel_set_now:
    alias: "Tankowanie: ustaw czas na teraz"
    icon: mdi:clock
    sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.fuel_datetime
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # --- 3) Zapisz tankowanie dla wybranego auta ------------------------------
  fuel_submit:
    alias: "Tankowanie: zapisz"
    icon: mdi:content-save
    variables:
      veh: "{{ states('input_select.fuel_vehicle') }}"
      sel: "{{ states('input_select.fuel_station') }}"
      # sensor najbliższej stacji wybranego auta (po slugu nazwy)
      station_sensor: "sensor.{{ veh | slugify }}_najblizsza_stacja"
      stations: "{{ state_attr(station_sensor, 'stations') or [] }}"
      ftype_map:
        "Benzyna 95 (Pb95)": 110
        "Benzyna 98 (Pb98)": 111
        "Benzyna 100 (Pb100/Verva/V-Power)": 112
        "Diesel (ON)": 120
        "Diesel Premium": 121
        "LPG": 130
        "CNG": 140
        "Prąd (EV)": 160
        "Inny": 0
      matched: >
        {% set ns = namespace(s=none) %}
        {% for s in stations %}
          {% if (s.name ~ ' (' ~ s.distance_m ~ ' m)') == sel %}{% set ns.s = s %}{% endif %}
        {% endfor %}
        {{ ns.s }}
      ts: >
        {% set v = states('input_datetime.fuel_datetime') %}
        {% if v not in ['unknown', 'unavailable', 'none'] %}
        {{ (v | as_datetime | as_local).isoformat() }}
        {% else %}
        {{ now().isoformat() }}
        {% endif %}
    sequence:
      - choose:
          # A) wybrano znalezioną stację (mamy współrzędne)
          - conditions: "{{ matched not in [none, 'None'] and matched }}"
            sequence:
              - service: fuel_manager.add_fueling
                data:
                  vehicle: "{{ veh }}"
                  odometer: "{{ states('input_number.fuel_odometer') | float }}"
                  fuel: "{{ states('input_number.fuel_liters') | float }}"
                  price_per_liter: "{{ states('input_number.fuel_price_per_liter') | float }}"
                  total_cost: "{{ states('input_number.fuel_total_cost') | float }}"
                  full: "{{ is_state('input_boolean.fuel_full_tank','on') }}"
                  fuel_type: "{{ ftype_map[states('input_select.fuel_type')] | default(110) }}"
                  timestamp: "{{ ts }}"
                  station_name: "{{ matched.name }}"
                  latitude: "{{ matched.latitude }}"
                  longitude: "{{ matched.longitude }}"
                  notes: "{{ states('input_text.fuel_notes') }}"
        # B) brak wybranej stacji – GPS auta lub nazwa ręczna
        default:
          - service: fuel_manager.add_fueling
            data:
              vehicle: "{{ veh }}"
              odometer: "{{ states('input_number.fuel_odometer') | float }}"
              fuel: "{{ states('input_number.fuel_liters') | float }}"
              price_per_liter: "{{ states('input_number.fuel_price_per_liter') | float }}"
              total_cost: "{{ states('input_number.fuel_total_cost') | float }}"
              full: "{{ is_state('input_boolean.fuel_full_tank','on') }}"
              fuel_type: "{{ ftype_map[states('input_select.fuel_type')] | default(110) }}"
              timestamp: "{{ ts }}"
              station_name: "{{ states('input_text.fuel_manual_station') }}"
              use_phone_location: true
              use_car_location: "{{ is_state('input_boolean.fuel_use_car_fallback','on') }}"
              notes: "{{ states('input_text.fuel_notes') }}"
      # reset formularza
      - service: input_number.set_value
        target: { entity_id: [input_number.fuel_liters, input_number.fuel_total_cost] }
        data: { value: 0 }
      - service: input_text.set_value
        target: { entity_id: [input_text.fuel_notes, input_text.fuel_manual_station] }
        data: { value: "" }

  # --- EDYCJA: odśwież listę tankowań do wyboru -----------------------------
  fuel_edit_refresh:
    alias: "Edycja: odśwież listę"
    icon: mdi:refresh
    sequence:
      - service: input_select.set_options
        target:
          entity_id: input_select.fuel_edit_target
        data:
          options: >
            {% set slug = states('input_select.fuel_vehicle') | slugify %}
            {% set rows = (state_attr('sensor.' ~ slug ~ '_historia_tankowan','fuelings') or [])[:60] %}
            {% set ns = namespace(o=[]) %}
            {% for f in rows %}
            {% set ns.o = ns.o + [ (f.timestamp[:16]|replace('T',' ')) ~ ' · ' ~ (f.odometer|round(0)|int) ~ ' km · ' ~ (f.station_name or '—') ] %}
            {% endfor %}
            {{ ns.o if ns.o else ['— brak tankowań —'] }}

  # --- EDYCJA: wczytaj wybrane tankowanie do pól ----------------------------
  fuel_edit_load:
    alias: "Edycja: wczytaj"
    icon: mdi:download
    sequence:
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.fuel_edit_lock }
      # 1) ustal ID na podstawie wybranej etykiety z listy
      - service: input_text.set_value
        target: { entity_id: input_text.fuel_edit_id }
        data:
          value: >
            {% set sel = states('input_select.fuel_edit_target') %}
            {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
            {% set ns = namespace(id='') %}
            {% for f in rows %}
            {% set label = (f.timestamp[:16]|replace('T',' ')) ~ ' · ' ~ (f.odometer|round(0)|int) ~ ' km · ' ~ (f.station_name or '—') %}
            {% if label == sel %}{% set ns.id = f.id %}{% endif %}
            {% endfor %}
            {{ ns.id }}
      # 2) wczytaj pola NIEZALEŻNIE po ID (świeży odczyt z sensora)
      - choose:
          - conditions: "{{ states('input_text.fuel_edit_id') | length > 3 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_edit_odometer }
                data:
                  value: >
                    {% set id = states('input_text.fuel_edit_id') %}
                    {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                    {% set f = rows | selectattr('id','eq',id) | list | first %}
                    {{ f.odometer if f else 0 }}
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_edit_fuel }
                data:
                  value: >
                    {% set id = states('input_text.fuel_edit_id') %}
                    {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                    {% set f = rows | selectattr('id','eq',id) | list | first %}
                    {{ f.fuel if f else 0 }}
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_edit_price }
                data:
                  value: >
                    {% set id = states('input_text.fuel_edit_id') %}
                    {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                    {% set f = rows | selectattr('id','eq',id) | list | first %}
                    {{ f.price_per_liter if (f and f.price_per_liter) else 0 }}
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_edit_total }
                data:
                  value: >
                    {% set id = states('input_text.fuel_edit_id') %}
                    {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                    {% set f = rows | selectattr('id','eq',id) | list | first %}
                    {{ f.total_cost if (f and f.total_cost) else 0 }}
              - service: input_text.set_value
                target: { entity_id: input_text.fuel_edit_station }
                data:
                  value: >
                    {% set id = states('input_text.fuel_edit_id') %}
                    {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                    {% set f = rows | selectattr('id','eq',id) | list | first %}
                    {{ f.station_name if f else '' }}
              - service: >
                  {% set id = states('input_text.fuel_edit_id') %}
                  {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                  {% set f = rows | selectattr('id','eq',id) | list | first %}
                  input_boolean.turn_{{ 'on' if (f and f.full) else 'off' }}
                target: { entity_id: input_boolean.fuel_edit_full }
              - service: input_select.select_option
                target: { entity_id: input_select.fuel_edit_type }
                data:
                  option: >
                    {% set id = states('input_text.fuel_edit_id') %}
                    {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
                    {% set f = rows | selectattr('id','eq',id) | list | first %}
                    {% set m = {110:'Benzyna 95 (Pb95)',111:'Benzyna 98 (Pb98)',112:'Benzyna 100 (Pb100/Verva/V-Power)',120:'Diesel (ON)',121:'Diesel Premium',130:'LPG',140:'CNG',160:'Prąd (EV)',0:'Inny'} %}
                    {{ m.get(f.fuel_type_code | int(110), 'Benzyna 95 (Pb95)') if f else 'Benzyna 95 (Pb95)' }}
        default:
          - service: input_text.set_value
            target: { entity_id: input_text.fuel_edit_id }
            data: { value: "" }
      - delay: "00:00:01"
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.fuel_edit_lock }

  # --- EDYCJA: wczytaj OSTATNIE tankowanie (skrót) --------------------------
  fuel_edit_last:
    alias: "Edycja: wczytaj ostatnie"
    icon: mdi:clock-fast
    sequence:
      - service: script.fuel_edit_refresh
      - delay: "00:00:01"
      - service: input_select.select_option
        target: { entity_id: input_select.fuel_edit_target }
        data:
          option: >
            {% set rows = state_attr('sensor.' ~ (states('input_select.fuel_vehicle')|slugify) ~ '_historia_tankowan','fuelings') or [] %}
            {% set f = rows[0] if rows else none %}
            {{ (f.timestamp[:16]|replace('T',' ')) ~ ' · ' ~ (f.odometer|round(0)|int) ~ ' km · ' ~ (f.station_name or '—') if f else '— brak tankowań —' }}
      - delay: "00:00:01"
      - service: script.fuel_edit_load

  # --- EDYCJA: zapisz zmiany ------------------------------------------------
  fuel_edit_save:
    alias: "Edycja: zapisz"
    icon: mdi:content-save-edit
    sequence:
      - condition: "{{ states('input_text.fuel_edit_id') not in ['', 'unknown', 'unavailable'] and (states('input_text.fuel_edit_id') | length) > 5 }}"
      - service: fuel_manager.edit_fueling
        data:
          vehicle: "{{ states('input_select.fuel_vehicle') }}"
          id: "{{ states('input_text.fuel_edit_id') }}"
          odometer: "{{ states('input_number.fuel_edit_odometer') | float }}"
          fuel: "{{ states('input_number.fuel_edit_fuel') | float }}"
          price_per_liter: "{{ states('input_number.fuel_edit_price') | float }}"
          total_cost: "{{ states('input_number.fuel_edit_total') | float }}"
          full: "{{ is_state('input_boolean.fuel_edit_full','on') }}"
          station_name: "{{ states('input_text.fuel_edit_station') }}"
          fuel_type: >
            {% set m = {'Benzyna 95 (Pb95)':110,'Benzyna 98 (Pb98)':111,'Benzyna 100 (Pb100/Verva/V-Power)':112,'Diesel (ON)':120,'Diesel Premium':121,'LPG':130,'CNG':140,'Prąd (EV)':160,'Inny':0} %}
            {{ m[states('input_select.fuel_edit_type')] | default(110) }}
      - delay: "00:00:01"
      - service: script.fuel_edit_refresh

  # --- EDYCJA: usuń wybrane tankowanie --------------------------------------
  fuel_edit_delete:
    alias: "Edycja: usuń"
    icon: mdi:delete
    sequence:
      - condition: "{{ states('input_text.fuel_edit_id') not in ['', 'unknown', 'unavailable'] and (states('input_text.fuel_edit_id') | length) > 5 }}"
      - service: fuel_manager.delete_fueling
        data:
          vehicle: "{{ states('input_select.fuel_vehicle') }}"
          id: "{{ states('input_text.fuel_edit_id') }}"
      - service: input_text.set_value
        target: { entity_id: input_text.fuel_edit_id }
        data: { value: "" }
      - delay: "00:00:01"
      - service: script.fuel_edit_refresh

  # ===== KOSZTY DODATKOWE =====================================================
  expense_add:
    alias: "Koszt: dodaj"
    icon: mdi:plus-circle
    sequence:
      - condition: "{{ states('input_number.expense_amount')|float(0) > 0 }}"
      - service: fuel_manager.add_expense
        data:
          vehicle: "{{ states('input_select.fuel_vehicle') }}"
          category: "{{ states('input_select.expense_category') }}"
          amount: "{{ states('input_number.expense_amount')|float }}"
          timestamp: >
            {% set d = states('input_datetime.expense_date') %}
            {{ (d ~ 'T12:00:00') if d not in ['unknown','unavailable',''] else now().isoformat() }}
          odometer: "{{ states('input_number.expense_odometer')|float(0) }}"
          description: "{{ states('input_text.expense_description') }}"
      - service: input_number.set_value
        target: { entity_id: input_number.expense_amount }
        data: { value: 0 }
      - service: input_text.set_value
        target: { entity_id: input_text.expense_description }
        data: { value: "" }
      - delay: "00:00:01"
      - service: script.expense_edit_refresh

  expense_edit_refresh:
    alias: "Koszt: odśwież listę"
    icon: mdi:refresh
    sequence:
      - service: input_select.set_options
        target: { entity_id: input_select.expense_edit_target }
        data:
          options: >
            {% set s = states('input_select.fuel_vehicle')|slugify %}
            {% set items = state_attr('sensor.' ~ s ~ '_koszty_dodatkowe','items') or [] %}
            {% set ns = namespace(o=[]) %}
            {% for e in items[:80] %}
            {% set ns.o = ns.o + [ e.date ~ ' · ' ~ e.category ~ ' · ' ~ (e.amount|round(2)) ~ ' zł' ~ (' · ' ~ e.description if e.description else '') ] %}
            {% endfor %}
            {{ ns.o if ns.o else ['— brak kosztów —'] }}

  expense_edit_load:
    alias: "Koszt: wczytaj"
    icon: mdi:download
    sequence:
      - service: input_text.set_value
        target: { entity_id: input_text.expense_edit_id }
        data:
          value: >
            {% set sel = states('input_select.expense_edit_target') %}
            {% set s = states('input_select.fuel_vehicle')|slugify %}
            {% set items = state_attr('sensor.' ~ s ~ '_koszty_dodatkowe','items') or [] %}
            {% set ns = namespace(id='') %}
            {% for e in items %}
            {% set label = e.date ~ ' · ' ~ e.category ~ ' · ' ~ (e.amount|round(2)) ~ ' zł' ~ (' · ' ~ e.description if e.description else '') %}
            {% if label == sel %}{% set ns.id = e.id %}{% endif %}
            {% endfor %}
            {{ ns.id }}
      - choose:
          - conditions: "{{ states('input_text.expense_edit_id') | length > 3 }}"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.expense_category }
                data:
                  option: >
                    {% set id = states('input_text.expense_edit_id') %}
                    {% set s = states('input_select.fuel_vehicle')|slugify %}
                    {% set e = (state_attr('sensor.' ~ s ~ '_koszty_dodatkowe','items') or []) | selectattr('id','eq',id) | list | first %}
                    {{ e.category if e else 'Inne' }}
              - service: input_number.set_value
                target: { entity_id: input_number.expense_amount }
                data:
                  value: >
                    {% set id = states('input_text.expense_edit_id') %}
                    {% set s = states('input_select.fuel_vehicle')|slugify %}
                    {% set e = (state_attr('sensor.' ~ s ~ '_koszty_dodatkowe','items') or []) | selectattr('id','eq',id) | list | first %}
                    {{ e.amount if e else 0 }}
              - service: input_number.set_value
                target: { entity_id: input_number.expense_odometer }
                data:
                  value: >
                    {% set id = states('input_text.expense_edit_id') %}
                    {% set s = states('input_select.fuel_vehicle')|slugify %}
                    {% set e = (state_attr('sensor.' ~ s ~ '_koszty_dodatkowe','items') or []) | selectattr('id','eq',id) | list | first %}
                    {{ e.odometer if (e and e.odometer) else 0 }}
              - service: input_text.set_value
                target: { entity_id: input_text.expense_description }
                data:
                  value: >
                    {% set id = states('input_text.expense_edit_id') %}
                    {% set s = states('input_select.fuel_vehicle')|slugify %}
                    {% set e = (state_attr('sensor.' ~ s ~ '_koszty_dodatkowe','items') or []) | selectattr('id','eq',id) | list | first %}
                    {{ e.description if e else '' }}
        default:
          - service: input_text.set_value
            target: { entity_id: input_text.expense_edit_id }
            data: { value: "" }

  expense_edit_save:
    alias: "Koszt: zapisz"
    icon: mdi:content-save-edit
    sequence:
      - condition: "{{ states('input_text.expense_edit_id') not in ['', 'unknown', 'unavailable'] and (states('input_text.expense_edit_id') | length) > 3 }}"
      - service: fuel_manager.edit_expense
        data:
          vehicle: "{{ states('input_select.fuel_vehicle') }}"
          id: "{{ states('input_text.expense_edit_id') }}"
          category: "{{ states('input_select.expense_category') }}"
          amount: "{{ states('input_number.expense_amount')|float }}"
          odometer: "{{ states('input_number.expense_odometer')|float(0) }}"
          description: "{{ states('input_text.expense_description') }}"
      - delay: "00:00:01"
      - service: script.expense_edit_refresh

  expense_edit_delete:
    alias: "Koszt: usuń"
    icon: mdi:delete
    sequence:
      - condition: "{{ states('input_text.expense_edit_id') not in ['', 'unknown', 'unavailable'] and (states('input_text.expense_edit_id') | length) > 3 }}"
      - service: fuel_manager.delete_expense
        data:
          vehicle: "{{ states('input_select.fuel_vehicle') }}"
          id: "{{ states('input_text.expense_edit_id') }}"
      - service: input_text.set_value
        target: { entity_id: input_text.expense_edit_id }
        data: { value: "" }
      - delay: "00:00:01"
      - service: script.expense_edit_refresh

automation:
  # --- AUTOWYLICZANIE: litry × cena/litr = kwota (i odwrotnie) ---------------
  # Podaj dwa dowolne pola, trzecie wyliczy się samo. Zabezpieczone przed pętlą
  # (ustawia wartość tylko, gdy po zaokrągleniu różni się od obecnej).
  - alias: "Fuel: kwota z litrów i ceny"
    id: fuel_calc_total
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_number.fuel_liters
          - input_number.fuel_price_per_liter
    condition:
      - condition: numeric_state
        entity_id: input_number.fuel_liters
        above: 0
      - condition: numeric_state
        entity_id: input_number.fuel_price_per_liter
        above: 0
      - condition: template
        value_template: >
          {{ (states('input_number.fuel_liters')|float(0) * states('input_number.fuel_price_per_liter')|float(0)) | round(2)
             != states('input_number.fuel_total_cost')|float(0) | round(2) }}
    action:
      - service: input_number.set_value
        target: { entity_id: input_number.fuel_total_cost }
        data:
          value: >
            {{ (states('input_number.fuel_liters')|float * states('input_number.fuel_price_per_liter')|float) | round(2) }}

  - alias: "Fuel: cena/litr lub litry z kwoty"
    id: fuel_calc_from_total
    mode: single
    trigger:
      - platform: state
        entity_id: input_number.fuel_total_cost
    action:
      - choose:
          # mamy litry -> licz cenę za litr (przypadek: litry + kwota)
          - conditions:
              - condition: numeric_state
                entity_id: input_number.fuel_liters
                above: 0
              - condition: template
                value_template: >
                  {{ (states('input_number.fuel_total_cost')|float(0) / states('input_number.fuel_liters')|float(1)) | round(3)
                     != states('input_number.fuel_price_per_liter')|float(0) | round(3) }}
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_price_per_liter }
                data:
                  value: >
                    {{ (states('input_number.fuel_total_cost')|float / states('input_number.fuel_liters')|float) | round(3) }}
          # nie ma litrów, ale jest cena -> licz litry (przypadek: cena + kwota)
          - conditions:
              - condition: numeric_state
                entity_id: input_number.fuel_price_per_liter
                above: 0
              - condition: template
                value_template: >
                  {{ (states('input_number.fuel_total_cost')|float(0) / states('input_number.fuel_price_per_liter')|float(1)) | round(2)
                     != states('input_number.fuel_liters')|float(0) | round(2) }}
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_liters }
                data:
                  value: >
                    {{ (states('input_number.fuel_total_cost')|float / states('input_number.fuel_price_per_liter')|float) | round(2) }}

  # --- AUTOWYLICZANIE W EDYTORZE (zapis nadal ręczny, na przycisk) -----------
  - alias: "Fuel edit: kwota z litrów i ceny"
    id: fuel_edit_calc_total
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_number.fuel_edit_fuel
          - input_number.fuel_edit_price
    condition:
      - condition: state
        entity_id: input_boolean.fuel_edit_lock
        state: "off"
      - condition: numeric_state
        entity_id: input_number.fuel_edit_fuel
        above: 0
      - condition: numeric_state
        entity_id: input_number.fuel_edit_price
        above: 0
      - condition: template
        value_template: >
          {{ (states('input_number.fuel_edit_fuel')|float(0) * states('input_number.fuel_edit_price')|float(0)) | round(2)
             != states('input_number.fuel_edit_total')|float(0) | round(2) }}
    action:
      - service: input_number.set_value
        target: { entity_id: input_number.fuel_edit_total }
        data:
          value: >
            {{ (states('input_number.fuel_edit_fuel')|float * states('input_number.fuel_edit_price')|float) | round(2) }}

  - alias: "Fuel edit: cena/litr lub litry z kwoty"
    id: fuel_edit_calc_from_total
    mode: single
    trigger:
      - platform: state
        entity_id: input_number.fuel_edit_total
    condition:
      - condition: state
        entity_id: input_boolean.fuel_edit_lock
        state: "off"
    action:
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: input_number.fuel_edit_fuel
                above: 0
              - condition: template
                value_template: >
                  {{ (states('input_number.fuel_edit_total')|float(0) / states('input_number.fuel_edit_fuel')|float(1)) | round(3)
                     != states('input_number.fuel_edit_price')|float(0) | round(3) }}
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_edit_price }
                data:
                  value: >
                    {{ (states('input_number.fuel_edit_total')|float / states('input_number.fuel_edit_fuel')|float) | round(3) }}
          - conditions:
              - condition: numeric_state
                entity_id: input_number.fuel_edit_price
                above: 0
              - condition: template
                value_template: >
                  {{ (states('input_number.fuel_edit_total')|float(0) / states('input_number.fuel_edit_price')|float(1)) | round(2)
                     != states('input_number.fuel_edit_fuel')|float(0) | round(2) }}
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.fuel_edit_fuel }
                data:
                  value: >
                    {{ (states('input_number.fuel_edit_total')|float / states('input_number.fuel_edit_price')|float) | round(2) }}
