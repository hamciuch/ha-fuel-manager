# =============================================================================
#  Widok "Tankowania" w stylu Fuelio — tylko karty wbudowane (bez HACS).
#  Wklej jako nowy widok: Ustawienia paneli -> Dodaj widok -> Edytuj w YAML
#  (lub w trybie surowego edytora całego dashboardu jako element listy "views").
#
#  Dopasowane do auta "MG EHS" (slug mg_ehs). Jeśli masz inne auto:
#   - w input_select.fuel_vehicle ustaw jego nazwę,
#   - wszędzie zamień "mg_ehs" na swój slug (Narzędzia deweloperskie ->
#     Statystyki -> zobacz fuel_manager:<slug>_...).
#  Wymaga pakietu z examples/packages/fuel_manager_dashboard.yaml (helpery + skrypty).
# =============================================================================
title: Tankowania
path: tankowania
icon: mdi:gas-station
cards:

  # ----- NAGŁÓWEK + KLUCZOWE LICZBY (podąża za wybranym autem) ---------------
  - type: markdown
    content: >
      {% set slug = states('input_select.fuel_vehicle') | slugify %}
      {% set p = 'sensor.' ~ slug ~ '_' %}
      ## ⛽ {{ states('input_select.fuel_vehicle') }}

      🚗 **{{ states(p ~ 'ostatni_przebieg') }}** km  ·  ⛽ śr.
      **{{ states(p ~ 'srednie_spalanie') }}** L/100km  ·  💸
      **{{ states(p ~ 'srednia_cena_litr') }}** zł/L  ·  📈
      **{{ states(p ~ 'koszt_na_km') }}** zł/km

      Łącznie: **{{ states(p ~ 'suma_kosztow_paliwa') }}** zł ·
      **{{ states(p ~ 'suma_zatankowanego_paliwa') }}** L ·
      **{{ states(p ~ 'liczba_tankowan') }}** tankowań

  # ----- FORMULARZ: NOWE TANKOWANIE -----------------------------------------
  - type: vertical-stack
    cards:
      - type: markdown
        content: "### ➕ Nowe tankowanie"
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_select.fuel_vehicle
            name: Auto
            icon: mdi:car
          - type: divider
          - entity: input_datetime.fuel_datetime
            name: Data i czas
          - entity: script.fuel_set_now
            name: Ustaw czas na teraz
            icon: mdi:clock-outline
          - type: divider
          - entity: input_number.fuel_odometer
            name: Przebieg (km)
          - entity: input_number.fuel_liters
            name: Litry
          - entity: input_number.fuel_price_per_liter
            name: Cena/litr
          - entity: input_number.fuel_total_cost
            name: Kwota całkowita
          - entity: input_select.fuel_type
            name: Rodzaj paliwa
          - entity: input_boolean.fuel_full_tank
            name: Pełny bak

      - type: markdown
        content: "### 📍 Stacja"
      - type: entities
        entities:
          - entity: sensor.mg_ehs_najblizsza_stacja
            name: Najbliższa (wykryta)
            icon: mdi:map-marker-radius
          - entity: input_select.fuel_station
            name: Wybór stacji
          - entity: input_text.fuel_manual_station
            name: Lub wpisz ręcznie
          - entity: input_boolean.fuel_use_car_fallback
            name: Zapasowo lokalizacja auta
          - entity: input_text.fuel_notes
            name: Notatki

      - type: horizontal-stack
        cards:
          - type: button
            name: Szukaj stacji
            icon: mdi:map-search
            show_state: false
            tap_action:
              action: call-service
              service: script.fuel_find_stations
          - type: button
            name: ZAPISZ
            icon: mdi:content-save-check
            tap_action:
              action: call-service
              service: script.fuel_submit

  # ----- EDYCJA / POPRAWA TANKOWANIA ----------------------------------------
  - type: vertical-stack
    cards:
      - type: markdown
        content: "### ✏️ Edytuj / popraw tankowanie"
      - type: entities
        entities:
          - entity: input_select.fuel_edit_target
            name: Wybierz tankowanie
      - type: button
        name: Odśwież listę
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: script.fuel_edit_refresh
      - type: entities
        title: Wczytane wartości (popraw i zapisz)
        entities:
          - entity: input_number.fuel_edit_odometer
            name: Przebieg (km)
          - entity: input_number.fuel_edit_fuel
            name: Litry
          - entity: input_number.fuel_edit_price
            name: Cena/litr
          - entity: input_number.fuel_edit_total
            name: Kwota
          - entity: input_text.fuel_edit_station
            name: Stacja
          - entity: input_boolean.fuel_edit_full
            name: Pełny bak
      - type: horizontal-stack
        cards:
          - type: button
            name: ZAPISZ ZMIANY
            icon: mdi:content-save-edit
            tap_action:
              action: call-service
              service: script.fuel_edit_save
          - type: button
            name: Usuń
            icon: mdi:delete
            tap_action:
              action: call-service
              service: script.fuel_edit_delete

  # ----- WSKAŹNIKI (gauge) --------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.mg_ehs_srednie_spalanie
        name: Śr. spalanie
        unit: L/100km
        min: 0
        max: 15
        needle: true
        severity:
          green: 0
          yellow: 7
          red: 10
      - type: gauge
        entity: sensor.mg_ehs_ostatnie_spalanie
        name: Ostatnie
        unit: L/100km
        min: 0
        max: 15
        needle: true
        severity:
          green: 0
          yellow: 7
          red: 10

  # ----- OSTATNIE TANKOWANIE ------------------------------------------------
  - type: glance
    title: Ostatnie tankowanie
    columns: 4
    entities:
      - entity: sensor.mg_ehs_ostatni_przebieg
        name: Przebieg
      - entity: sensor.mg_ehs_ostatnia_cena_litr
        name: Cena/L
      - entity: sensor.mg_ehs_ostatnia_kwota
        name: Kwota
      - entity: sensor.mg_ehs_ostatnie_spalanie
        name: Spalanie

  # ----- WYKRESY INTERAKTYWNE (ApexCharts) ----------------------------------
  # Wymaga karty "ApexCharts Card" z HACS (Frontend). Czyta listę tankowań
  # z atrybutu sensora -> każdy punkt to jedno tankowanie, najazd = szczegóły.
  - type: custom:apexcharts-card
    graph_span: 600d
    header:
      show: true
      title: Spalanie · cena · kwota
      show_states: false
    yaxis:
      - id: lewa
        min: 0
        decimals: 1
      - id: prawa
        opposite: true
        min: 0
        decimals: 2
    series:
      - entity: sensor.mg_ehs_historia_tankowan
        name: Spalanie (L/100km)
        unit: " L/100km"
        type: line
        yaxis_id: lewa
        stroke_width: 2
        curve: smooth
        data_generator: >
          return (entity.attributes.fuelings || [])
            .filter(f => f.consumption)
            .map(f => [ new Date(f.timestamp).getTime(), f.consumption ])
            .sort((a,b) => a[0]-b[0]);
      - entity: sensor.mg_ehs_historia_tankowan
        name: Cena (zł/L)
        unit: " zł/L"
        type: line
        yaxis_id: prawa
        stroke_width: 2
        curve: smooth
        data_generator: >
          return (entity.attributes.fuelings || [])
            .map(f => [ new Date(f.timestamp).getTime(), f.price_per_liter ])
            .sort((a,b) => a[0]-b[0]);
      - entity: sensor.mg_ehs_historia_tankowan
        name: Kwota (zł)
        unit: " zł"
        type: column
        yaxis_id: prawa
        opacity: 0.25
        data_generator: >
          return (entity.attributes.fuelings || [])
            .map(f => [ new Date(f.timestamp).getTime(), f.total_cost ])
            .sort((a,b) => a[0]-b[0]);
    apex_config:
      chart:
        height: 300
      markers:
        size: 4
      stroke:
        width: [2, 2, 0]
      tooltip:
        shared: true
        x:
          format: "dd MMM yyyy HH:mm"

  - type: custom:apexcharts-card
    graph_span: 600d
    header:
      show: true
      title: Przebieg
      show_states: false
    series:
      - entity: sensor.mg_ehs_historia_tankowan
        name: Przebieg (km)
        unit: " km"
        type: line
        stroke_width: 2
        data_generator: >
          return (entity.attributes.fuelings || [])
            .map(f => [ new Date(f.timestamp).getTime(), f.odometer ])
            .sort((a,b) => a[0]-b[0]);
    apex_config:
      chart:
        height: 240
      markers:
        size: 4
      tooltip:
        x:
          format: "dd MMM yyyy"

  # ----- PEŁNA HISTORIA (jak dziennik w Fuelio) -----------------------------
  - type: markdown
    content: >
      {% set slug = states('input_select.fuel_vehicle') | slugify %}
      {% set rows = state_attr('sensor.' ~ slug ~ '_historia_tankowan', 'fuelings') or [] %}
      {% set ns = namespace(t='\n## 📒 Historia tankowań (' ~ rows|count ~ ')\n\n') %}
      {% for f in rows %}{% set ns.t = ns.t ~ '- **' ~ (f.timestamp[:16]|replace('T',' ')) ~ '** · ' ~ (f.odometer|round(0)) ~ ' km · ' ~ f.fuel ~ ' L · ' ~ f.price_per_liter ~ ' zł/L · ' ~ f.total_cost ~ ' zł · ' ~ (f.consumption if f.consumption else '–') ~ ' L/100km' ~ (' · ' ~ f.station_name if f.station_name else '') ~ '\n' %}{% endfor %}
      {{ ns.t }}
