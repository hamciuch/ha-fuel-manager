- title: Koszty dodatkowe
  path: koszty-dodatkowe
  icon: mdi:wrench-clock
  cards:
  - *id001
  - type: vertical-stack
    cards:
    - type: markdown
      content: '### 🧰 Dodaj koszt (przegląd, ubezpieczenie, serwis…)'
    - type: entities
      entities:
      - entity: input_select.expense_category
        name: Kategoria
      - entity: input_number.expense_amount
        name: Kwota (zł)
      - entity: input_datetime.expense_date
        name: Data
      - entity: input_number.expense_odometer
        name: Przebieg (opcjonalnie)
      - entity: input_text.expense_description
        name: Opis (co robione)
    - type: button
      name: DODAJ KOSZT
      icon: mdi:plus-circle
      tap_action:
        action: call-service
        service: script.expense_add
  - type: vertical-stack
    cards:
    - type: markdown
      content: '### ✏️ Edytuj / usuń koszt'
    - type: entities
      entities:
      - entity: input_select.expense_edit_target
        name: Wybierz koszt
    - type: horizontal-stack
      cards:
      - type: button
        name: Odśwież listę
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: script.expense_edit_refresh
      - type: button
        name: Wczytaj wybrane
        icon: mdi:download
        tap_action:
          action: call-service
          service: script.expense_edit_load
    - type: markdown
      content: _Po wczytaniu zmień pola w sekcji „Dodaj koszt” powyżej i zapisz._
    - type: horizontal-stack
      cards:
      - type: button
        name: ZAPISZ ZMIANY
        icon: mdi:content-save-edit
        tap_action:
          action: call-service
          service: script.expense_edit_save
      - type: button
        name: Usuń
        icon: mdi:delete
        tap_action:
          action: call-service
          service: script.expense_edit_delete
  - type: markdown
    content: '{%- set s = states(''input_select.fuel_vehicle'')|slugify -%}

      {%- set e = ''sensor.'' ~ s ~ ''_koszty_dodatkowe'' -%}

      ### 🛠️ Koszty dodatkowe łącznie

      # {{ state_attr(e,''total'') }} zł

      **Ten rok ({{ state_attr(e,''this_year'') }}):** {{ state_attr(e,''this_year_total'') }} zł &nbsp;•&nbsp; **Poprzedni ({{ state_attr(e,''prev_year'') }}):** {{ state_attr(e,''prev_year_total'') }} zł


      #### Wg kategorii

      | Kategoria | Kwota |

      |:--|--:|

      {% for k,v in (state_attr(e,''by_category'') or {}).items() %}| {{ k }} | **{{ v }} zł** |

      {% endfor %}'
  - type: custom:apexcharts-card
    chart_type: bar
    graph_span: 1500d
    span:
      end: year
    header:
      show: true
      title: Koszty dodatkowe / rok
    series:
    - entity: sensor.mg_ehs_koszty_dodatkowe
      name: Koszty dodatkowe / rok
      type: column
      unit: ' zł'
      color: null
      data_generator: return Object.entries(entity.attributes.by_year || {}).map(([y,v]) => [new Date(parseInt(y),0,1).getTime(), v]);
    apex_config:
      xaxis:
        labels:
          format: yyyy
      tooltip:
        x:
          format: yyyy
      plotOptions:
        bar:
          columnWidth: 40%
      dataLabels:
        enabled: true
  - type: markdown
    content: '{%- set s = states(''input_select.fuel_vehicle'')|slugify -%}

      {%- set e = ''sensor.'' ~ s ~ ''_koszty_dodatkowe'' -%}

      ### 🧾 Historia kosztów

      {% for it in (state_attr(e,''items'') or [])[:60] %}**{{ it.date }}** · {{ it.category }} · **{{ it.amount }} zł**{% if it.description %} — {{ it.description }}{% endif %}


      {% else %}_Brak kosztów._{% endfor %}'
- title: Przegląd
  path: przeglad
  icon: mdi:view-dashboard
  cards:
  - type: markdown
    content: '{% set slug = states(''input_select.fuel_vehicle'') | slugify %} {% set p = ''sensor.'' ~ slug ~ ''_'' %} ## ⛽ {{ states(''input_select.fuel_vehicle'') }}

      🚗 **{{ states(p ~ ''ostatni_przebieg'') }}** km  ·  ⛽ śr. **{{ states(p ~ ''srednie_spalanie'') }}** L/100km  ·  💸 **{{ states(p ~ ''srednia_cena_litr'') }}** zł/L  ·  📈 **{{ states(p ~ ''koszt_na_km'') }}** zł/km

      Łącznie: **{{ states(p ~ ''suma_kosztow_paliwa'') }}** zł · **{{ states(p ~ ''suma_zatankowanego_paliwa'') }}** L · **{{ states(p ~ ''liczba_tankowan'') }}** tankowań

      '
  - type: horizontal-stack
    cards:
    - type: gauge
      entity: sensor.mg_ehs_srednie_spalanie
      name: Śr. spalanie
      unit: L/100km
      min: 0
      max: 15
      needle: true
      severity:
        green: 0
        yellow: 7
        red: 10
    - type: gauge
      entity: sensor.mg_ehs_ostatnie_spalanie
      name: Ostatnie
      unit: L/100km
      min: 0
      max: 15
      needle: true
      severity:
        green: 0
        yellow: 7
        red: 10
  - type: custom:apexcharts-card
    graph_span: 600d
    header:
      show: true
      title: Spalanie · cena · kwota
      show_states: false
    yaxis:
    - id: lewa
      min: 0
      decimals: 1
    - id: prawa
      opposite: true
      min: 0
      decimals: 2
    series:
    - entity: sensor.mg_ehs_historia_tankowan
      name: Spalanie (L/100km)
      unit: ' L/100km'
      type: line
      yaxis_id: lewa
      stroke_width: 2
      curve: smooth
      data_generator: "return (entity.attributes.fuelings || [])\n  .filter(f => f.consumption)\n  .map(f => [ new Date(f.timestamp).getTime(), f.consumption ])\n  .sort((a,b) => a[0]-b[0]);\n"
    - entity: sensor.mg_ehs_historia_tankowan
      name: Cena (zł/L)
      unit: ' zł/L'
      type: line
      yaxis_id: prawa
      stroke_width: 2
      curve: smooth
      data_generator: "return (entity.attributes.fuelings || [])\n  .map(f => [ new Date(f.timestamp).getTime(), f.price_per_liter ])\n  .sort((a,b) => a[0]-b[0]);\n"
    - entity: sensor.mg_ehs_historia_tankowan
      name: Kwota (zł)
      unit: ' zł'
      type: column
      yaxis_id: prawa
      opacity: 0.25
      data_generator: "return (entity.attributes.fuelings || [])\n  .map(f => [ new Date(f.timestamp).getTime(), f.total_cost ])\n  .sort((a,b) => a[0]-b[0]);\n"
    apex_config:
      chart:
        height: 300
      markers:
        size: 4
      stroke:
        width:
        - 2
        - 2
        - 0
      tooltip:
        shared: true
        x:
          format: dd MMM yyyy HH:mm
  - type: custom:apexcharts-card
    graph_span: 600d
    header:
      show: true
      title: Przebieg
      show_states: false
    series:
    - entity: sensor.mg_ehs_historia_tankowan
      name: Przebieg (km)
      unit: ' km'
      type: line
      stroke_width: 2
      data_generator: "return (entity.attributes.fuelings || [])\n  .map(f => [ new Date(f.timestamp).getTime(), f.odometer ])\n  .sort((a,b) => a[0]-b[0]);\n"
    apex_config:
      chart:
        height: 240
      markers:
        size: 4
      tooltip:
        x:
          format: dd MMM yyyy
