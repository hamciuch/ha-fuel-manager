title: Tankowania
views:
- title: Tankowania
  path: tankowania
  icon: mdi:gas-station
  cards:
  - &id001
    type: entities
    entities:
    - entity: input_select.fuel_vehicle
      name: Pojazd
  - type: vertical-stack
    cards:
    - type: markdown
      content: '### ➕ Nowe tankowanie'
    - type: entities
      show_header_toggle: false
      state_color: true
      entities:
      - entity: input_select.fuel_vehicle
        name: Auto
        icon: mdi:car
      - type: divider
      - entity: input_datetime.fuel_datetime
        name: Data i czas
      - entity: script.fuel_set_now
        name: Ustaw czas na teraz
        icon: mdi:clock-outline
      - type: divider
      - entity: input_number.fuel_odometer
        name: Przebieg (km)
      - entity: input_number.fuel_liters
        name: Litry
      - entity: input_number.fuel_price_per_liter
        name: Cena/litr
      - entity: input_number.fuel_total_cost
        name: Kwota całkowita
      - entity: input_select.fuel_type
        name: Rodzaj paliwa
      - entity: input_boolean.fuel_full_tank
        name: Pełny bak
    - type: markdown
      content: '### 📍 Stacja'
    - type: entities
      entities:
      - entity: sensor.mg_ehs_najblizsza_stacja
        name: Najbliższa (wykryta)
        icon: mdi:map-marker-radius
      - entity: input_select.fuel_station
        name: Wybór stacji
      - entity: input_text.fuel_manual_station
        name: Lub wpisz ręcznie
      - entity: input_boolean.fuel_use_car_fallback
        name: Zapasowo lokalizacja auta
      - entity: input_text.fuel_notes
        name: Notatki
    - type: horizontal-stack
      cards:
      - type: button
        name: Szukaj stacji
        icon: mdi:map-search
        show_state: false
        tap_action:
          action: call-service
          service: script.fuel_find_stations
      - type: button
        name: ZAPISZ
        icon: mdi:content-save-check
        tap_action:
          action: call-service
          service: script.fuel_submit
  - type: vertical-stack
    cards:
    - type: markdown
      content: '### ✏️ Edytuj / popraw tankowanie'
    - type: button
      name: Edytuj ostatnie tankowanie
      icon: mdi:clock-fast
      tap_action:
        action: call-service
        service: script.fuel_edit_last
    - type: entities
      entities:
      - entity: input_select.fuel_edit_target
        name: Wybierz tankowanie
    - type: horizontal-stack
      cards:
      - type: button
        name: Odśwież listę
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: script.fuel_edit_refresh
      - type: button
        name: Wczytaj wybrane
        icon: mdi:download
        tap_action:
          action: call-service
          service: script.fuel_edit_load
    - type: entities
      title: Wczytane wartości (popraw i zapisz)
      entities:
      - entity: input_number.fuel_edit_odometer
        name: Przebieg (km)
      - entity: input_number.fuel_edit_fuel
        name: Litry
      - entity: input_number.fuel_edit_price
        name: Cena/litr
      - entity: input_number.fuel_edit_total
        name: Kwota
      - entity: input_text.fuel_edit_station
        name: Stacja
      - entity: input_select.fuel_edit_type
        name: Rodzaj paliwa
      - entity: input_boolean.fuel_edit_full
        name: Pełny bak
    - type: horizontal-stack
      cards:
      - type: button
        name: ZAPISZ ZMIANY
        icon: mdi:content-save-edit
        tap_action:
          action: call-service
          service: script.fuel_edit_save
      - type: button
        name: Usuń
        icon: mdi:delete
        tap_action:
          action: call-service
          service: script.fuel_edit_delete
  - type: glance
    title: Ostatnie tankowanie
    columns: 4
    entities:
    - entity: sensor.mg_ehs_ostatni_przebieg
      name: Przebieg
    - entity: sensor.mg_ehs_ostatnia_cena_litr
      name: Cena/L
    - entity: sensor.mg_ehs_ostatnia_kwota
      name: Kwota
    - entity: sensor.mg_ehs_ostatnie_spalanie
      name: Spalanie
  - type: markdown
    content: '{% set slug = states(''input_select.fuel_vehicle'') | slugify %} {% set rows = state_attr(''sensor.'' ~ slug ~ ''_historia_tankowan'', ''fuelings'') or [] %} {% set ns = namespace(t=''\n## 📒 Historia tankowań ('' ~ rows|count ~ '')\n\n'') %} {% for f in rows %}{% set ns.t = ns.t ~ ''- **'' ~ (f.timestamp[:16]|replace(''T'','' '')) ~ ''** · '' ~ f.odometer|round(0) ~ '' km · '' ~ f.fuel ~ '' L · '' ~ f.price_per_liter ~ '' zł/L · '' ~ f.total_cost ~ '' zł · '' ~ (f.consumption if f.consumption else ''–'') ~ '' L/100km'' ~ ('' · '' ~ f.station_name if f.station_name else '''') ~ ''\n'' %}{% endfor %} {{ ns.t }}

      '
- title: Koszty
  path: koszty
  icon: mdi:cash-multiple
  cards:
  - type: markdown
    content: '{%- set s = states(''input_select.fuel_vehicle'')|slugify -%}

      {%- set a = ''sensor.'' ~ s ~ ''_analiza'' -%}

      {%- macro zl(x) -%}{{ ''{:,.2f}''.format(x|float(0)).replace('','', '' '').replace(''.'', '','') }}{%- endmacro -%}

      {%- macro n0(x) -%}{{ ''{:,.0f}''.format(x|float(0)).replace('','', '' '') }}{%- endmacro -%}

      {%- macro n3(x) -%}{{ ''{:,.3f}''.format(x|float(0)).replace('','', '' '').replace(''.'', '','') }}{%- endmacro -%}

      ## 💰 Koszty paliwa


      # {{ zl(state_attr(a,''total_spend'')) }} zł

      łącznie wydane na paliwo


      | Okres | Kwota |

      |:--|--:|

      | **Ten rok ({{ state_attr(a,''this_year'') }})** | **{{ zl(state_attr(a,''spend_this_year'')) }} zł** |

      | Poprzedni ({{ state_attr(a,''prev_year'') }}) | {{ zl(state_attr(a,''spend_prev_year'')) }} zł |


      ---


      ### ⛽ Ceny i rachunki


      | | |

      |:--|--:|

      | Najniższa cena/L | **{{ n3(state_attr(a,''min_price'')) }} zł** |

      | Najwyższa cena/L | **{{ n3(state_attr(a,''max_price'')) }} zł** |

      | Najniższy rachunek | **{{ zl(state_attr(a,''min_bill'')) }} zł** |

      | Najwyższy rachunek | **{{ zl(state_attr(a,''max_bill'')) }} zł** |


      ---


      ### 🛣️ Koszt na kilometr


      | | |

      |:--|--:|

      | Średni | **{{ n3(state_attr(a,''avg_cost_per_km'')) }} zł/km** |

      | Najniższy | {{ n3(state_attr(a,''min_cost_per_km'')) }} zł/km |

      | Najwyższy | {{ n3(state_attr(a,''max_cost_per_km'')) }} zł/km |

      | Średni koszt dzienny | **{{ zl(state_attr(a,''avg_daily_cost'')) }} zł/dzień** |

      '
  - type: custom:apexcharts-card
    header:
      show: true
      title: Wydatki / miesiąc (14 mies.)
    graph_span: 430d
    span:
      end: month
    series:
    - entity: sensor.mg_ehs_analiza
      name: Wydatki / miesiąc (14 mies.)
      type: column
      unit: ' zł'
      color: var(--warning-color)
      data_generator: return (entity.attributes.monthly || []).map(m => [m.ts, m.spend]);
    apex_config:
      xaxis:
        labels:
          datetimeFormatter:
            month: MMM yy
      plotOptions:
        bar:
          columnWidth: 60%
  - type: custom:apexcharts-card
    chart_type: bar
    graph_span: 1500d
    span:
      end: year
    header:
      show: true
      title: Wydatki / rok
    series:
    - entity: sensor.mg_ehs_analiza
      name: Wydatki / rok
      type: column
      unit: ' zł'
      color: var(--error-color)
      data_generator: return Object.entries(entity.attributes.spend_by_year || {}).map(([y,v]) => [new Date(parseInt(y),0,1).getTime(), v]);
    apex_config:
      xaxis:
        labels:
          format: yyyy
      tooltip:
        x:
          format: yyyy
      plotOptions:
        bar:
          columnWidth: 40%
      dataLabels:
        enabled: true
- title: Odległość
