# =============================================================================
#  Dashboard "Tankowania" (WIELOAUTOWY) – wklej jako nowy widok (edytor surowy).
#  Formularz przekazuje wybrane auto do serwisów. Statystyki i historia
#  podążają za autem wybranym w input_select.fuel_vehicle (szablony Jinja).
#  Nie wymaga kart z HACS.
# =============================================================================
title: Tankowania
path: tankowania
icon: mdi:gas-station
cards:
  # --- FORMULARZ NOWEGO TANKOWANIA ------------------------------------------
  - type: vertical-stack
    cards:
      - type: markdown
        content: "## ⛽ Nowe tankowanie"
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.fuel_vehicle
            name: Auto
          - entity: input_datetime.fuel_datetime
            name: Data i czas
          - entity: script.fuel_set_now
            name: Ustaw czas na teraz
            icon: mdi:clock
          - entity: input_number.fuel_odometer
            name: Przebieg (km)
          - entity: input_number.fuel_liters
            name: Litry
          - entity: input_number.fuel_price_per_liter
            name: Cena/litr
          - entity: input_number.fuel_total_cost
            name: Kwota
          - entity: input_select.fuel_type
            name: Rodzaj paliwa
          - entity: input_boolean.fuel_full_tank
            name: Pełny bak
          - entity: input_boolean.fuel_use_car_fallback
            name: Zapasowo lokalizacja auta
          - entity: input_text.fuel_notes
            name: Notatki

      - type: markdown
        content: "### 📍 Stacja"
      - type: entities
        entities:
          - entity: input_select.fuel_station
            name: Wybór stacji
          - entity: input_text.fuel_manual_station
            name: Lub wpisz ręcznie

      - type: horizontal-stack
        cards:
          - type: button
            name: Szukaj stacji
            icon: mdi:map-search
            tap_action:
              action: call-service
              service: script.fuel_find_stations
          - type: button
            name: Zapisz tankowanie
            icon: mdi:content-save
            tap_action:
              action: call-service
              service: script.fuel_submit

  # --- STATYSTYKI + HISTORIA WYBRANEGO AUTA (dynamicznie) -------------------
  - type: markdown
    content: >
      {% set slug = states('input_select.fuel_vehicle') | slugify %}
      {% set p = 'sensor.' ~ slug ~ '_' %}
      ## 📊 {{ states('input_select.fuel_vehicle') }}

      | Śr. spalanie | Śr. cena/L | Koszt/km | Suma kosztów | Litrów | Tankowań |
      | ---: | ---: | ---: | ---: | ---: | ---: |
      | {{ states(p ~ 'srednie_spalanie') }} | {{ states(p ~ 'srednia_cena_litr') }} |
      {{ states(p ~ 'koszt_na_km') }} | {{ states(p ~ 'suma_kosztow_paliwa') }} |
      {{ states(p ~ 'suma_zatankowanego_paliwa') }} | {{ states(p ~ 'liczba_tankowan') }} |

      **Ostatnie:** przebieg {{ states(p ~ 'ostatni_przebieg') }} km ·
      {{ states(p ~ 'ostatnia_cena_litr') }} zł/L ·
      {{ states(p ~ 'ostatnia_kwota') }} zł ·
      spalanie {{ states(p ~ 'ostatnie_spalanie') }} L/100km

      ### Historia

      | Data | Przebieg | Litry | Cena/L | Kwota | Spalanie | Stacja |
      | --- | ---: | ---: | ---: | ---: | ---: | --- |
      {% for f in state_attr(p ~ 'historia_tankowan', 'fuelings') or [] -%}
      | {{ f.timestamp[:16] | replace('T',' ') }} | {{ f.odometer | round(0) }} | {{ f.fuel }} | {{ f.price_per_liter }} | {{ f.total_cost }} | {{ f.consumption if f.consumption else '–' }} | {{ f.station_name }} |
      {% endfor %}
