<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9E5B"/>
      <stop offset="1" stop-color="#1B7A42"/>
    </linearGradient>
  </defs>
  <!-- tło: zaokrąglony kwadrat z przezroczystymi rogami -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#bg)"/>

  <!-- korpus dystrybutora -->
  <rect x="120" y="120" width="170" height="280" rx="22" fill="#FFFFFF"/>
  <!-- okno wyświetlacza -->
  <rect x="150" y="156" width="110" height="80" rx="12" fill="#1B7A42"/>
  <!-- "cyfry" na wyświetlaczu -->
  <rect x="164" y="182" width="82" height="12" rx="6" fill="#7BE0A4"/>
  <rect x="164" y="204" width="60" height="12" rx="6" fill="#7BE0A4"/>
  <!-- przycisk / kreska na froncie -->
  <rect x="150" y="268" width="110" height="16" rx="8" fill="#D7F3E1"/>
  <rect x="150" y="300" width="110" height="16" rx="8" fill="#D7F3E1"/>

  <!-- wąż i pistolet po prawej -->
  <path d="M290 210
           h44
           a26 26 0 0 1 26 26
           v150
           a30 30 0 0 0 60 0
           v-118
           h-26
           a18 18 0 0 1 -18 -18
           v-44"
        fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- zbiorniczek pistoletu -->
  <rect x="320" y="150" width="34" height="70" rx="12" fill="#FFFFFF"/>

  <!-- kropla paliwa -->
  <path d="M398 150
           c 18 24 30 40 30 58
           a30 30 0 0 1 -60 0
           c 0 -18 12 -34 30 -58 z"
        fill="#FFFFFF"/>
</svg>
